/* ─── File: variables.css ─── */
/* ==========================================================================
   Design Tokens & Variables — Emergência Pro
   ========================================================================== */

:root {
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SFMono-Regular', 'Courier New', Courier, monospace;
  --color-text-primary: #111827;
  --color-text-secondary: #6b7280;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f3f4f6;
  --color-border-tertiary: #e5e7eb;
  --color-border-secondary: #d1d5db;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}

body {
  background: #f3f4f6;
  font-family: var(--font-sans);
  color: var(--color-text-primary);
}

html {
  scroll-behavior: smooth;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

input, select, textarea {
  padding: 7px 10px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  font-family: var(--font-sans);
  outline: none;
  transition: border-color 0.15s;
  box-sizing: border-box;
  width: 100%;
  font-size: 14px;
}
input:focus, select:focus, textarea:focus {
  border-color: #a32d2d;
}
textarea {
  resize: vertical;
  min-height: 60px;
}

/* Animações Globais */
@keyframes cockpitPulseRed {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
@keyframes slideUpDrawer {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes slideInRight {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}


/* ─── File: layout.css ─── */
/* ==========================================================================
   Layout & Grid Architecture — Emergência Pro
   ========================================================================== */

.app {
  max-width: 680px;
  margin: 0 auto;
  padding: 1rem 0;
  font-family: var(--font-sans);
  color: var(--color-text-primary);
}

/* Header & Barra Superior */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}
.hdr-brand-bar, .hdr-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.hdr-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hdr-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--color-text-primary);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.hdr-badge-status {
  font-size: 10px;
  color: #15803d;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 12px;
  padding: 2px 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}
.hdr-badge-status i {
  font-size: 8px;
  color: #16a34a;
}
.hdr-subtitle {
  font-size: 12.5px;
  color: var(--color-text-secondary);
  margin-top: 2px;
}
.hdr-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}
.hdr-divider {
  width: 1px;
  height: 20px;
  background: var(--color-border-secondary, #e2e8f0);
  margin: 0 3px;
  flex-shrink: 0;
}
.hdr-action-btn {
  padding: 6px 12px;
  border-radius: 18px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: inherit;
  text-decoration: none;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  color: var(--color-text-secondary);
  transition: all 0.15s ease;
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.hdr-action-btn:hover {
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
}
.hdr-action-btn:active {
  transform: scale(0.96);
}
.hdr-action-btn i {
  font-size: 15px;
  flex-shrink: 0;
}
.hdr-action-btn.hdr-btn-icon {
  width: 34px;
  height: 34px;
  min-width: 34px;
  padding: 0;
  border-radius: 8px;
  justify-content: center;
}
.hdr-action-btn.hdr-btn-icon span {
  display: none;
}
.hdr-action-btn.hdr-btn-icon i {
  font-size: 16px;
  margin: 0;
}
.hdr-btn-decision { background: #fffbeb; border-color: #fde68a; color: #b45309; font-weight: 600; }
.hdr-btn-decision:hover { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.hdr-btn-decision i { color: #d97706; }
.hdr-btn-crunch { background: #fff7ed; border-color: #fed7aa; color: #c2410c; font-weight: 600; }
.hdr-btn-crunch:hover { background: #ffedd5; color: #9a3412; border-color: #fdba74; }
.hdr-btn-crunch i { color: #ea580c; }
.hdr-btn-home { background: #f8fafc; border-color: #e2e8f0; color: #475569; }
.hdr-btn-home:hover { background: #f1f5f9; color: #1e293b; }
.hdr-btn-shift { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; font-weight: 500; }
.hdr-btn-shift:hover { background: #dcfce7; color: #166534; }
.hdr-btn-shift i { color: #16a34a; }
.hdr-btn-admin { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; font-weight: 500; }
.hdr-btn-admin:hover { background: #dbeafe; color: #1e40af; }
.hdr-btn-admin i { color: #2563eb; }
.hdr-btn-shortcut { background: #f8fafc; border-color: #e2e8f0; color: #475569; }
.hdr-btn-shortcut:hover { background: #f1f5f9; color: #1e293b; }
.hdr-btn-reset { background: #f8fafc; border-color: #e2e8f0; color: #64748b; }
.hdr-btn-reset:hover { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
.hdr-btn-night { background: #0f172a; border-color: #334155; color: #f8fafc; font-weight: 500; }
.hdr-btn-night:hover { background: #1e293b; color: #38bdf8; border-color: #475569; }
.hdr-btn-night.active { background: #38bdf8; color: #0f172a; border-color: #0284c7; }
.hdr-btn-night i { color: #f59e0b; }
.hdr-btn-logout { background: #fcebeb; border-color: #f09595; color: #a32d2d; font-weight: 500; }
.hdr-btn-logout:hover { background: #fad4d4; color: #7f1d1d; }

.hico {
  width: 40px;
  height: 40px;
  background: #f8fafc;
  border-radius: var(--border-radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.hico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hico i { font-size: 20px; color: #a32d2d; }

/* Barra de Etapas (Dock Segmentado) */
.steps {
  display: flex;
  gap: 6px;
  margin-bottom: 1.25rem;
  overflow-x: auto;
  background: var(--color-background-primary);
  padding: 6px;
  border-radius: 14px;
  border: 1px solid var(--color-border-tertiary);
  box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  scrollbar-width: none;
}
.steps::-webkit-scrollbar { display: none; }
.step {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  border: 0.5px solid var(--color-border-tertiary);
  cursor: pointer;
  white-space: nowrap;
  background: var(--color-background-primary);
  color: var(--color-text-secondary);
  transition: all 0.18s ease;
  user-select: none;
}
.step:hover {
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
  border-color: var(--color-border-secondary);
  transform: translateY(-1px);
}
.step:active { transform: translateY(0); }
.step.active {
  background: #fcebeb;
  border-color: #e24b4a;
  color: #a32d2d;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(163,45,45,0.1);
}
.step.done {
  background: #f0fdf4;
  border-color: #86efac;
  color: #15803d;
}
.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  background: rgba(0,0,0,0.06);
  margin-right: 2px;
}
.step.active .step-num { background: #a32d2d; color: #fff; }
.step.done .step-num { background: #16a34a; color: #fff; }

.card[id^="step-"], #step-0, #step-1, #step-2, #step-3, #step-4, #step-5 {
  scroll-margin-top: 72px;
}

/* Two-column desktop layout & Split Screen */
.two-col-wrap { display: block; }
.col-rel { display: none; }
.btn-split {
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--color-text-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 6px;
}
.btn-split:hover, .btn-split.active {
  background: #2563eb;
  color: #fff;
  border-color: #1d4ed8;
}

@media(min-width: 1024px) {
  .app { max-width: 1800px; padding: 1rem; }
  .two-col-wrap { display: grid; grid-template-columns: 1fr 440px; gap: 1rem; align-items: start; }
  .two-col-wrap.split-50-50 { grid-template-columns: 1fr 1fr !important; }
  .col-rel { display: flex; flex-direction: column; position: sticky; top: 1rem; height: calc(100vh - 90px); }
  .rel-col-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
  }
  .rel-col-hdr {
    padding: 0.65rem 1rem;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .rel-col-textarea {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    resize: none;
    border: none;
    border-radius: 0;
    background: var(--color-background-secondary);
    font-family: var(--font-mono);
    font-size: 13px !important;
    line-height: 1.55;
    padding: 1rem;
    color: var(--color-text-primary);
    transition: background-color 0.3s ease;
  }
  .rel-col-actions {
    padding: 0.5rem 1rem;
    border-top: 0.5px solid var(--color-border-tertiary);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .rel-col-actions .btng { padding: 7px 14px; font-size: 13px; }
  .desktop-hide-relcard { display: none; }
}

.rel-col-txt-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.25s ease, border-color 0.25s ease;
}
.rel-col-txt-wrap.live-diff-highlight {
  box-shadow: 0 0 0 2px #10b981, 0 4px 12px rgba(16,185,129,0.18) !important;
  border-color: #10b981 !important;
}
.rel-col-textarea.live-diff-highlight {
  background-color: rgba(16,185,129,0.06) !important;
}

/* Responsividade Mobile e Geral */
.mobile-only { display: none !important; }
@media(max-width: 768px) {
  .hdr { flex-direction: column; align-items: stretch; gap: 8px; margin-bottom: 1rem; padding-bottom: 0.75rem; }
  .hdr-brand-bar { justify-content: space-between; width: 100%; }
  .hdr-title { font-size: 16px; }
  .mobile-only { display: inline-flex !important; }
  .desktop-only-logout { display: none !important; }
  .hdr-divider { display: none !important; }
  .hdr-actions { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 2px 6px; gap: 7px; width: 100%; scrollbar-width: none; }
  .hdr-actions::-webkit-scrollbar { display: none; }
  .hdr-action-btn { height: 36px; padding: 0 12px; font-size: 12px; border-radius: 18px; flex-shrink: 0; }
  .hdr-action-btn.hdr-btn-icon { width: 34px !important; height: 34px !important; min-width: 34px !important; padding: 0 !important; border-radius: 8px !important; }
}
@media(max-width: 640px) { .hide-mobile { display: none !important; } }
@media(max-width: 480px) { .hide-mobile-tab-text { display: none; } }

/* Impressão Limpa */
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 11pt !important; }
  .top-banner, .app-hdr, .nav, .btns, .btng, .btnp, .xbtn, .fab-btn, .fab-drawer-overlay, 
  .admin-overlay, .modal-bg, .app-footer, .rg, #shortcutModal, #toast, .desktop-hide-relcard,
  #step-0, #step-1, #step-2, #step-3, #step-4, .psm, .abox {
    display: none !important;
  }
  .app-body { display: block !important; padding: 0 !important; margin: 0 !important; }
  .col-main { display: none !important; }
  .col-rel { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
  .rel-col-inner { border: none !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
  .rel-col-hdr, .rel-col-actions { display: none !important; }
  .rel-col-textarea { 
    display: block !important;
    border: none !important; 
    height: auto !important; 
    min-height: 100vh !important;
    overflow: visible !important; 
    font-family: monospace !important; 
    font-size: 10pt !important; 
    line-height: 1.5 !important;
    white-space: pre-wrap !important;
    color: #000 !important;
    background: transparent !important;
    resize: none !important;
  }
}


/* ─── File: components.css ─── */
/* ==========================================================================
   UI Components & Clinical Controls — Emergência Pro
   ========================================================================== */

/* Cartões e Títulos */
.card {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.st {
  font-size: 13px;
  font-weight: 700;
  color: #0f172a;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--color-border-tertiary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.st::before {
  content: '';
  width: 3.5px;
  height: 14px;
  border-radius: 2px;
  background: #a32d2d;
  flex-shrink: 0;
}
.st i { font-size: 16px; color: #a32d2d; }
.sl { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 4px; }

/* Grids e Formas */
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.r5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 8px; }
label { display: block; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }

/* Botões do Sistema */
.btnp { padding: 9px 18px; background: #a32d2d; color: #fff; border: none; border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: background 0.15s; }
.btnp:hover { background: #791f1f; }
.btns { padding: 9px 16px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); color: var(--color-text-primary); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: all 0.15s; }
.btns:hover { background: var(--color-background-secondary); }
.btng { padding: 9px 16px; background: #15803d; color: #fff; border: none; border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: background 0.15s; }
.btng:hover { background: #166534; }
.xbtn { padding: 9px 11px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); font-size: 13px; cursor: pointer; text-align: left; color: var(--color-text-primary); line-height: 1.4; transition: all 0.15s; }
.xbtn:hover { background: var(--color-background-secondary); border-color: var(--color-border-secondary); }
.xbtn.on { background: #fee2e2; border-color: #f87171; color: #991b1b; font-weight: 600; }

.btn-clean-patient { background: #dc2626 !important; color: #fff !important; border: none !important; font-weight: 600; }
.btn-clean-patient:hover { background: #b91c1c !important; }

/* Drums de Idade */
.age-drums { display: flex; align-items: center; gap: 5px; }
.drum { display: flex; flex-direction: column; align-items: center; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); overflow: hidden; width: 40px; }
.drum-btn { width: 100%; padding: 3px 0; border: none; background: none; cursor: pointer; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.drum-btn:hover { background: var(--color-border-tertiary); }
.drum-dig { font-size: 22px; font-weight: 500; padding: 4px 0; text-align: center; line-height: 1; color: var(--color-text-primary); }
.drum-unit { font-size: 12px; color: var(--color-text-secondary); margin-left: 2px; }

/* Seletor de Queixas (qgrid) */
.qgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.qcat { margin-bottom: 12px; }
.qcat:last-child { margin-bottom: 0; }
.qcat-lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--color-text-secondary); margin-bottom: 6px; padding-left: 2px; }
.qcat-critica .qcat-lbl { color: #a32d2d; }
.qcat-externa .qcat-lbl { color: #a26b1f; }
.qcat-cardio .qcat-lbl { color: #dc2626; }
.qcat-cardio .qbtn { border-color: #fecaca; background: #fff5f5; }
.qcat-cardio .qbtn:hover { background: #fee2e2; border-color: #ef4444; color: #991b1b; font-weight: 500; }
.qcat-resp .qcat-lbl { color: #0284c7; }
.qcat-resp .qbtn { border-color: #bae6fd; background: #f0f9ff; }
.qcat-resp .qbtn:hover { background: #e0f2fe; border-color: #0ea5e9; color: #0369a1; font-weight: 500; }
.qcat-neuro .qcat-lbl { color: #7c3aed; }
.qcat-neuro .qbtn { border-color: #ddd6fe; background: #f5f3ff; }
.qcat-neuro .qbtn:hover { background: #ede9fe; border-color: #8b5cf6; color: #6d28d9; font-weight: 500; }
.qcat-digest .qcat-lbl { color: #059669; }
.qcat-digest .qbtn { border-color: #a7f3d0; background: #f0fdf4; }
.qcat-digest .qbtn:hover { background: #dcfce7; border-color: #10b981; color: #047857; font-weight: 500; }
.qcat-geral .qcat-lbl { color: #d97706; }
.qcat-geral .qbtn { border-color: #fde68a; background: #fffbeb; }
.qcat-geral .qbtn:hover { background: #fef3c7; border-color: #f59e0b; color: #b45309; font-weight: 500; }
.qcat-trauma .qcat-lbl { color: #ea580c; }
.qcat-trauma .qbtn { border-color: #fed7aa; background: #fff7ed; }
.qbtn { padding: 9px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); font-size: 13px; cursor: pointer; text-align: left; color: var(--color-text-primary); transition: all 0.15s; }
.qbtn.on { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; font-weight: 600; }

/* Tags, Radio Group & Pílulas */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 5px 10px; border-radius: 16px; border: 0.5px solid var(--color-border-secondary); font-size: 12px; cursor: pointer; background: var(--color-background-primary); color: var(--color-text-secondary); transition: all 0.15s; user-select: none; }
.tag:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.tag.on { background: #e0f2fe; border-color: #38bdf8; color: #0369a1; font-weight: 600; }
.rg { display: flex; flex-wrap: wrap; gap: 6px; }
.ro { padding: 5px 11px; border-radius: 16px; border: 0.5px solid var(--color-border-secondary); font-size: 12px; cursor: pointer; background: var(--color-background-primary); color: var(--color-text-secondary); transition: all 0.15s; user-select: none; }
.ro:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.ro.on { background: #fee2e2; border-color: #f87171; color: #991b1b; font-weight: 600; }

/* Acordeões e ABCDE */
.abcs { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); margin-bottom: 7px; overflow: hidden; }
.abch { padding: 9px 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: var(--color-background-secondary); font-size: 14px; font-weight: 500; transition: background 0.15s ease; }
.abch:hover { background: #f1f5f9; }
.abcb { padding: 12px; border-top: 0.5px solid var(--color-border-tertiary); display: none; }
.abcb.open {
  display: block;
}
.abcb.open.anim-open {
  animation: accSlideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes accSlideDown {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.abcde-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 5px; background: #7c3aed; color: #fff; font-weight: 700; font-size: 11px; margin-right: 6px; flex-shrink: 0; }

/* Telemetry HUD — Sinais Vitais Compactos */
.vital-hud-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.vital-hud-card {
  background: var(--color-background-primary);
  border: 1px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  padding: 8px 12px;

  flex-direction: column;

  transition: all 0.18s ease;
  border-left: 3.5px solid #cbd5e1;
}
.vital-hud-card:focus-within {
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
  border-color: #93c5fd;
}
.vital-hud-card.vok {
  border-left-color: #22c55e !important;
}
.vital-hud-card.vw {
  border-left-color: #f59e0b !important;
  background: #fffbeb !important;
}
.vital-hud-card.vc {
  border-left-color: #ef4444 !important;
  background: #fef2f2 !important;
  box-shadow: 0 0 0 1px #fecaca;
}
.vital-hud-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 3px;
}
.vital-hud-lbl {
  font-size: 11px;
  font-weight: 700;
  color: #475569;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.vital-hud-unit {
  font-size: 10.5px;
  color: #94a3b8;
  font-weight: 500;
}
.vital-hud-input {
  width: 100%;
  border: none !important;
  background: transparent !important;
  padding: 2px 0 !important;
  font-size: 16px !important;
  font-weight: 700 !important;
  color: var(--color-text-primary) !important;
  outline: none !important;
  box-shadow: none !important;
  font-family: inherit;
}
.vital-hud-input::placeholder {
  color: #cbd5e1;
  font-weight: 400;
  font-size: 13px;
}

/* Segmented HUD Controls — Exame Físico ABCDE */
.seg-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  gap: 10px;
  flex-wrap: wrap;
}
.seg-row:last-child {
  border-bottom: none;
}
.seg-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-primary);
  min-width: 110px;
  flex-shrink: 0;
}
.seg-control {
  display: inline-flex;

  background: #f1f5f9;
  border-radius: 6px;
  padding: 2px;

}
.seg-btn {

}

}

}

}

  padding: 3px 8px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--color-text-secondary);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: inherit;
}
.seg-tag-btn:hover {
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
}
.seg-tag-btn.on {
  background: #fee2e2;
  border-color: #fca5a5;
  color: #991b1b;
  font-weight: 600;
}

/* Vitals & Scores */
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
.srow { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--color-border-tertiary); gap: 10px; }
.slbl { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
.sdsc { font-size: 11px; color: var(--color-text-secondary); }
.sopts { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.sopt { padding: 3px 9px; border-radius: 20px; border: 0.5px solid var(--color-border-tertiary); font-size: 12px; cursor: pointer; background: var(--color-background-primary); color: var(--color-text-primary); }
.sopt.on { background: #e6f1fb; border-color: #378add; color: #185fa5; font-weight: 500; }
.sopt.auto { background: #eaf3de; border-color: #639922; color: #3b6d11; font-weight: 500; cursor: default; }

/* Cockpit Clínico & Apoio Beira-Leito */
.sticky-clinical-cockpit {
  position: sticky;
  top: 0;
  z-index: 85;
  background: var(--color-background-primary, #ffffff);
  border: 1px solid var(--color-border-tertiary, #e5e7eb);
  border-radius: 12px;
  padding: 8px 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.cockpit-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--color-text-primary, #111827); }
.cockpit-meta { color: var(--color-text-secondary, #4b5563); font-size: 12px; font-weight: 500; }
.cockpit-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cockpit-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.cockpit-badge.badge-stable { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.cockpit-badge.badge-unstable { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; animation: cockpitPulseRed 2s infinite ease-in-out; }
.cockpit-badge.badge-allergy { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

.cockpit-decision-panel {
  background: var(--color-background-primary, #ffffff);
  border: 1px solid var(--color-border-secondary, #cbd5e1);
  border-radius: 12px;
  margin-bottom: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  overflow: hidden;
  transition: all 0.25s ease-in-out;
}
.cockpit-decision-hdr {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #ffffff;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.cockpit-decision-title { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.2px; }
.cockpit-decision-controls { display: flex; align-items: center; gap: 8px; }
.cockpit-close-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #ffffff; border-radius: 6px; padding: 4px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: background 0.15s ease; }
.cockpit-close-btn:hover { background: rgba(255,255,255,0.22); }
.cockpit-decision-body { padding: 12px 14px; max-height: 480px; overflow-y: auto; }
.cockpit-search-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; position: relative; }
.cockpit-search-input { width: 100%; padding: 7px 30px 7px 11px; font-size: 12.5px; border: 1px solid var(--color-border-secondary, #cbd5e1); border-radius: 8px; background: var(--color-background-primary, #ffffff); color: var(--color-text-primary, #111827); outline: none; box-sizing: border-box; }
.cockpit-search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
.cockpit-search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; font-size: 16px; color: #94a3b8; cursor: pointer; line-height: 1; }
.cockpit-chips-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
.cockpit-chip { flex-shrink: 0; padding: 4px 10px; font-size: 11.5px; font-weight: 600; border-radius: 20px; border: 1px solid var(--color-border-tertiary, #e2e8f0); background: var(--color-background-secondary, #f8fafc); color: var(--color-text-secondary, #475569); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s ease; }
.cockpit-chip:hover { border-color: #94a3b8; color: var(--color-text-primary, #0f172a); }
.cockpit-chip.active { background: #0f172a; color: #ffffff; border-color: #0f172a; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.cockpit-pinned-alert { background: #eff6ff; border-left: 4px solid #2563eb; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 12px; color: #1e40af; display: flex; align-items: center; justify-content: space-between; }
.cockpit-pitfall-banner { background: #fffbeb; border: 1.5px dashed #f59e0b; border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 12.5px; line-height: 1.55; color: #92400e; }
.cockpit-pitfall-title { font-weight: 700; font-size: 12.5px; color: #b45309; display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.cockpit-empty-slot { padding: 8px 12px; background: var(--color-background-secondary, #f8fafc); border-radius: 6px; border: 1px dashed var(--color-border-tertiary, #e2e8f0); font-size: 12px; color: var(--color-text-secondary, #64748b); margin: 6px 0; }

.decision-card { border: 1px solid var(--color-border-secondary); border-radius: 14px; background: #ffffff; padding: 14px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 2px 8px rgba(15,23,42,0.03); transition: transform 0.15s, box-shadow 0.15s; }
.decision-card-title { font-size: 13.5px; font-weight: 700; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; }
.decision-meta-item { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; line-height: 1.55; color: #334155; }
.decision-meta-bullet { width: 6px; height: 6px; border-radius: 50%; background: #d97706; margin-top: 7px; flex-shrink: 0; }
.formula-callout { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 8px 10px; margin: 6px 0; color: #9a3412; font-size: 12px; }

/* Condutas: Seções e Tags */
.csec { border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); margin-bottom: 8px; background: var(--color-background-primary); overflow: hidden; }
.csh { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: var(--color-background-primary); font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); }
.csb { padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary); display: none; background: var(--color-background-primary); }
.csb.open { display: block; }
.chk { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--border-radius-md); cursor: pointer; font-size: 13px; line-height: 1.45; margin-bottom: 3px; transition: all 0.12s ease; border-left: 3px solid transparent; }
.chk:hover { background: var(--color-background-secondary); }
.chk.on, .chk.done { background: #f0fdf4 !important; color: #14532d !important; font-weight: 500; border-left: 3px solid #16a34a !important; }
.chk.rec { background: #fef2f2 !important; color: #991b1b !important; text-decoration: line-through; border-left: 3px solid #dc2626 !important; }
.cico { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--color-border-secondary); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; background: var(--color-background-primary); transition: all 0.12s ease; }
.chk.on .cico, .chk.done .cico { background: #16a34a !important; border-color: #16a34a !important; color: #fff !important; }
.chk.rec .cico { background: #dc2626 !important; border-color: #dc2626 !important; color: #fff !important; }

.csec-sup { border-left: 4px solid #dc2626; }
.csec-inv { border-left: 4px solid #16a34a; }
.csec-sin { border-left: 4px solid #0284c7; }
.csec-esp { border-left: 4px solid #9f1239; }
.csec-dsp { border-left: 4px solid #64748b; }

.csec-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; padding: 2px 7px; border-radius: 10px; display: inline-block; }
.csec-tag-sup { background: #fee2e2; color: #b91c1c; border: 0.5px solid #fca5a5; }
.csec-tag-inv { background: #dcfce7; color: #15803d; border: 0.5px solid #86efac; }
.csec-tag-sin { background: #e0f2fe; color: #0369a1; border: 0.5px solid #7dd3fc; }
.csec-tag-esp { background: #ffe4e6; color: #9f1239; border: 0.5px solid #fda4af; }
.csec-tag-dsp { background: #f1f5f9; color: #475569; border: 0.5px solid #cbd5e1; }

/* NEWS2 */
.news2-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; margin-top: 10px; }

.news2-badge-baixo { background: #eaf3de; color: #2e7d32; border: 0.5px solid #a5d6a7; }
.news2-badge-medio { background: #fff8e1; color: #b45309; border: 0.5px solid #fde68a; }
.news2-badge-alto { background: #fee2e2; color: #b91c1c; border: 0.5px solid #fca5a5; }

.rel-col-txt-wrap:focus-within .rel-section-copy-overlay,

.kbd { display: inline-block; padding: 2px 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; line-height: 1.4; color: #1f2937; background-color: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; box-shadow: inset 0 -1px 0 #cbd5e1; }

/* ─── Header & Toolbar do Prontuário (.col-rel) ─── */
.rel-col-hdr {
  padding: 8px 12px;
  background: var(--color-background-primary);
  border-bottom: 0.5px solid var(--color-border-tertiary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;

  align-items: center;

/* ─── Guia de Consulta Rápida de Porta / Ambulatório (Adultos) ─── */

let _isPortaModalOpen = false;
let _selectedPortaId = 'cistite';
let _portaSearchQuery = '';
let _selectedPortaCategory = 'todos';
let _portaCertDays = {};

function openPortaGuideModal(){
  _isPortaModalOpen = true;
  const overlay = document.getElementById('porta-guide-overlay');
  if(overlay){
    overlay.style.display = 'flex';
    overlay.setAttribute('aria-hidden', 'false');
    renderPortaGuideContent();
    const input = document.getElementById('porta-search-input');
    if(input) input.focus();
  }
}

function closePortaGuideModal(){
  _isPortaModalOpen = false;
  const overlay = document.getElementById('porta-guide-overlay');
  if(overlay){
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
  }
}

function togglePortaGuideModal(){
  if(_isPortaModalOpen) closePortaGuideModal();
  else openPortaGuideModal();
}

function selectPortaPathology(id){
  _selectedPortaId = id;
  renderPortaGuideContent();
  const cardElem = document.getElementById('porta-active-card');
  if(cardElem) cardElem.scrollTop = 0;
}

function setPortaCategory(catId){
  _selectedPortaCategory = catId;
  const filtered = getFilteredPortaList();
  if(filtered.length > 0 && !filtered.some(p => p.id === _selectedPortaId)){
    _selectedPortaId = filtered[0].id;
  }
  renderPortaGuideContent();
}

function onPortaSearch(q){
  _portaSearchQuery = (q || '').trim().toLowerCase();
  const filtered = getFilteredPortaList();
  if(filtered.length > 0 && !filtered.some(p => p.id === _selectedPortaId)){
    _selectedPortaId = filtered[0].id;
  }
  renderPortaGuideContent();
}

function clearPortaSearch(){
  _portaSearchQuery = '';
  const input = document.getElementById('porta-search-input');
  if(input){ input.value = ''; input.focus(); }
  renderPortaGuideContent();
}

function setPortaCertDays(id, days){
  _portaCertDays[id] = parseInt(days, 10) || 1;
  renderPortaGuideContent();
}

function getFilteredPortaList(){
  let list = PORTA_CATALOG;
  if(_selectedPortaCategory && _selectedPortaCategory !== 'todos'){
    list = list.filter(p => p.category === _selectedPortaCategory);
  }
  if(_portaSearchQuery){
    const q = _portaSearchQuery;
    list = list.filter(p => {
      const matchTitle = (p.title || '').toLowerCase().includes(q);
      const matchCid = (p.cid10 || '').toLowerCase().includes(q);
      const matchCat = (p.categoryLabel || '').toLowerCase().includes(q);
      const matchKeys = (p.searchKeywords || []).some(k => k.toLowerCase().includes(q));
      return matchTitle || matchCid || matchCat || matchKeys;
    });
  }
  return list;
}

function copyPortaPrescription(id){
  const p = PORTA_CATALOG.find(x => x.id === id);
  if(!p) return;
  const lines = [`# PRESCRIÇÃO MÉDICA AMBULATORIAL — ${p.title} (CID-10: ${p.cid10})`];
  
  if(p.prescription.firstLine && p.prescription.firstLine.length){
    lines.push('\n[1ª Linha / Preferencial]');
    p.prescription.firstLine.forEach(it => {
      lines.push(`- ${it.drug || it}: ${it.regimen || ''} ${it.duration ? '('+it.duration+')' : ''}`.trim());
    });
  }
  if(p.prescription.secondLine && p.prescription.secondLine.length){
    lines.push('\n[2ª Linha / Alternativa]');
    p.prescription.secondLine.forEach(it => {
      lines.push(`- ${it.drug || it}: ${it.regimen || ''} ${it.duration ? '('+it.duration+')' : ''}`.trim());
    });
  }
  if(p.prescription.symptomatic && p.prescription.symptomatic.length){
    lines.push('\n[Sintomáticos & Controle de Sintomas]');
    p.prescription.symptomatic.forEach(it => {
      lines.push(`- ${it.drug || it}: ${it.regimen || ''} ${it.duration ? '('+it.duration+')' : ''}`.trim());
    });
  }
  if(!p.prescription.firstLine?.length && !p.prescription.secondLine?.length && !p.prescription.symptomatic?.length){
    lines.push('\n(Prescrição em aguardo de compilação pelo médico)');
  }

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Prescrição de ${p.title} copiada para a área de transferência!`);
  });
}

function copyPortaOrientations(id){
  const p = PORTA_CATALOG.find(x => x.id === id);
  if(!p) return;
  const lines = [`# ORIENTAÇÕES AO PACIENTE — ${p.title}`];
  if(p.nonPharm && p.nonPharm.length){
    lines.push('\n[Medidas e Cuidados Gerais]');
    p.nonPharm.forEach(m => lines.push(`- ${m}`));
  }
  if(p.discharge && p.discharge.alarmCriteria){
    lines.push('\n[SINAIS DE ALARME / QUANDO RETORNAR AO PRONTO-ATENDIMENTO]');
    lines.push(p.discharge.alarmCriteria);
  }
  if(!p.nonPharm?.length && !p.discharge?.alarmCriteria){
    lines.push('\n(Orientações em aguardo de compilação pelo médico)');
  }

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Orientações ao paciente copiadas!`);
  });
}

function copyPortaCertificate(id){
  const p = PORTA_CATALOG.find(x => x.id === id);
  if(!p) return;
  const days = _portaCertDays[id] !== undefined ? _portaCertDays[id] : (p.discharge.defaultCertDays || 1);
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR');
  
  const text = `ATESTADO MÉDICO\n\nAtesto para os devidos fins que o(a) paciente esteve sob meus cuidados médicos no dia de hoje (${dateStr}), necessitando de ${days} (${days === 1 ? 'um dia' : days + ' dias'}) de repouso por motivo de saúde.\n\nCID-10: ${p.cid10} (${p.title})`;
  
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Atestado de ${days} dia(s) copiado com sucesso!`);
  });
}

          <!-- 1a Linha -->
          <div style="margin-bottom:8px">
            <strong style="font-size:11.5px;color:#166534;text-transform:uppercase;letter-spacing:0.5px">1ª Linha / Esquema Preferencial:</strong>
            ${activePathology.prescription.firstLine && activePathology.prescription.firstLine.length ? `
              <ul style="margin:4px 0 0 18px;padding:0;font-size:12.5px;line-height:1.5;color:#14532d">
                ${activePathology.prescription.firstLine.map(it => `<li><strong>${esc(it.drug || it)}</strong> — ${esc(it.regimen || '')} ${it.duration ? `<em>(${esc(it.duration)})</em>` : ''}</li>`).join('')}
              </ul>
            ` : `
              <div style="font-size:12px;color:#64748b;font-style:italic;margin-top:2px">
                (Aguardando compilação da 1ª linha terapêutica)
              </div>
            `}
          </div>

          <!-- 2a Linha -->
          <div style="margin-bottom:8px;padding-top:6px;border-top:1px dashed #dcfce7">
            <strong style="font-size:11.5px;color:#166534;text-transform:uppercase;letter-spacing:0.5px">2ª Linha / Alternativa (Alergias ou Intolerância):</strong>
            ${activePathology.prescription.secondLine && activePathology.prescription.secondLine.length ? `
              <ul style="margin:4px 0 0 18px;padding:0;font-size:12.5px;line-height:1.5;color:#14532d">
                ${activePathology.prescription.secondLine.map(it => `<li>${esc(it.drug || it)} — ${esc(it.regimen || '')} ${it.duration ? `<em>(${esc(it.duration)})</em>` : ''}</li>`).join('')}
              </ul>
            ` : `
              <div style="font-size:12px;color:#64748b;font-style:italic;margin-top:2px">
                (Aguardando compilação da 2ª linha / alternativas)
              </div>
            `}
          </div>

          <!-- Sintomaticos -->
          <div style="padding-top:6px;border-top:1px dashed #dcfce7">
            <strong style="font-size:11.5px;color:#166534;text-transform:uppercase;letter-spacing:0.5px">Sintomáticos & Controle de Sintomas:</strong>
            ${activePathology.prescription.symptomatic && activePathology.prescription.symptomatic.length ? `
              <ul style="margin:4px 0 0 18px;padding:0;font-size:12.5px;line-height:1.5;color:#14532d">
                ${activePathology.prescription.symptomatic.map(it => `<li>${esc(it.drug || it)}: ${esc(it.regimen || '')}</li>`).join('')}
              </ul>
            ` : `
              <div style="font-size:12px;color:#64748b;font-style:italic;margin-top:2px">
                (Aguardando compilação de sintomáticos de resgate)
              </div>
            `}
          </div>
        </div>

        <!-- 4. Medidas Nao Farmacologicas & Orientacoes (Cinza/Roxo) -->
        <div style="margin-bottom:14px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:12px">
          <div style="font-size:12.5px;font-weight:700;color:#334155;margin-bottom:6px;display:flex;align-items:center;gap:6px">
            <i class="ti ti-shield"></i> 4. Medidas Não Farmacológicas & Orientações de Alta:
          </div>
          ${activePathology.nonPharm && activePathology.nonPharm.length ? `
            <ul style="margin:0 0 8px 18px;padding:0;font-size:12.5px;line-height:1.5;color:#475569">
              ${activePathology.nonPharm.map(m => `<li>${esc(m)}</li>`).join('')}
            </ul>
          ` : `
            <div style="font-size:12px;color:#64748b;font-style:italic;margin-bottom:6px">
              (Aguardando compilação das medidas não farmacológicas)
            </div>
          `}
          ${activePathology.discharge && activePathology.discharge.alarmCriteria ? `
            <div style="font-size:12px;padding:8px;background:#fff;border-radius:6px;border:1px solid #e2e8f0;color:#1e293b">
              <strong>Critérios de retorno imediato ao pronto-atendimento:</strong> ${esc(activePathology.discharge.alarmCriteria)}
            </div>
          ` : ''}
        </div>

        <!-- 5. Modulo Interativo de Atestado Medico -->
        <div style="border:1px solid #e9d5ff;border-radius:8px;background:#faf5ff;padding:12px">
          <div style="font-size:12.5px;font-weight:700;color:#7e22ce;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
            <span style="display:flex;align-items:center;gap:6px"><i class="ti ti-certificate"></i> 5. Gerador de Atestado Médico / Declaração:</span>
            <button type="button" class="btng" style="padding:3px 9px;font-size:11.5px;background:#7e22ce" onclick="copyPortaCertificate('${activePathology.id}')">
              <i class="ti ti-copy"></i> Copiar Atestado
            </button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
            <span style="font-size:12px;color:#6b21a8;font-weight:600">Período de repouso:</span>
            ${[0, 1, 2, 3, 5, 7].map(d => `
              <button type="button" class="xbtn ${certDays === d ? 'on' : ''}" style="padding:2px 8px;font-size:11px;border-radius:12px" onclick="setPortaCertDays('${activePathology.id}', ${d})">
                ${d === 0 ? 'Apenas horas' : `${d} dia${d > 1 ? 's' : ''}`}
              </button>
            `).join('')}
          </div>
          <div style="background:#fff;border:1px dashed #d8b4fe;border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.45;color:#3b0764">
            <em>"Atesto para os devidos fins que o(a) paciente necessita de <strong>${certDays} dia(s)</strong> de repouso por motivo de saúde a partir desta data. CID-10: <strong>${esc(activePathology.cid10)} (${esc(activePathology.title)})</strong>."</em>
          </div>
        </div>

      </div>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderPortaGuideContent();
});
</script>
</body>
</html>
